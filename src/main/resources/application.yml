server:
  port: 8080
  servlet:
    context-path: /identity

spring:
  application:
    name: MessingApplication
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/dmessing
    username: postgres
    password: 11111111
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 5
    spring:
      mail:
        host: smtp.gmail.com
        port: 587
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}
        properties:
          mail:
            transport:
              protocol: smtp
            smtp:
              auth: true
              starttls:
                enable: true
                required: true